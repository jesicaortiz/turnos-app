<section class="login-page">

  <div class="container">

    <mat-card class="card login-card">

      <div class="header">

        <span class="badge">
          Acceso Administrador
        </span>

        <h1>
          Iniciar Sesión
        </h1>

      </div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="ingresar()"
      >

        <mat-form-field appearance="outline">

          <mat-label>
            Email
          </mat-label>

          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
          >

          <mat-error
            *ngIf="loginForm.get('email')?.hasError('required')">

            Ingresá tu email

          </mat-error>

          <mat-error
            *ngIf="loginForm.get('email')?.hasError('email')">

            Ingresá un email válido

          </mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>
            Contraseña
          </mat-label>

          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          >

          <mat-error
            *ngIf="loginForm.get('password')?.hasError('required')">

            Ingresá tu contraseña

          </mat-error>

        </mat-form-field>

        <button
          mat-raised-button
          type="submit"
          class="btn-login"
          [disabled]="loginForm.invalid || cargando"
        >
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>

      </form>

    </mat-card>

  </div>

</section>
